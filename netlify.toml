[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Explicit adapter configuration is required: a raw .next upload has no server routing.
# Database, storage and mail secrets belong in the dashboard/API, scoped to
# Builds AND Functions. Values in this file alone are not function secrets.
# Keep production noindex until the hosted publishing workflow is verified.
